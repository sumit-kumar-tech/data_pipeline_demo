    { name = "sumit-kumar-tech", email = "sumitme752@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dagshub==0.7.0",
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
    "ipykernel>=7.3.0",
    "joblib==1.5.3",
    "matplotlib==3.11.0",
    "mlflow==3.14.0",
    "numpy==2.5.0",
    "pandas==2.3.3",
