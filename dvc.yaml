stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
    - src/data_ingestion.py
    - data/sample_data.csv
    params:
    - data_ingestion.test_size
    - data_ingestion.random_state
    outs:
    - data/raw

  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
    - data/raw
    - src/data_preprocessing.py
    outs:
    - data/processed

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
    - data/processed
    - src/feature_engineering.py
    params:
    - feature_engineering.target_positive_class
    outs:
    - data/features

  model_building:
    cmd: python src/model_building.py
    deps:
    - data/features
    - src/model_building.py
    params:
    - model_building.decision_tree.max_depth
    - model_building.decision_tree.random_state
    - model_building.random_forest.n_estimators
    - model_building.random_forest.max_depth
    - model_building.random_forest.random_state
    - model_building.xgboost.n_estimators
    - model_building.xgboost.max_depth
    - model_building.xgboost.learning_rate
    - model_building.xgboost.random_state
    outs:
    - models

  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
    - data/features
    - models
    - src/model_evaluation.py
    metrics:
    - result/metrics.json:
        cache: false
